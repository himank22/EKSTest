name: Build and Deploy to EKS

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: himankrepo1
  EKS_CLUSTER: eks-learning
  K8S_NAMESPACE: practice
  DEPLOYMENT_NAME: ekstest-deployment
  CONTAINER_NAME: ekstest

jobs:
  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Configure AWS using GitHub OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::230235764463:role/GitHubActions-EKSTest
          aws-region: ${{ env.AWS_REGION }}

      # 3. Login to ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 4. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} .

      # 5. Push image to ECR
      - name: Push Docker image
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      # 6. Configure kubectl
      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $EKS_CLUSTER

      # 7. Install kubectl
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      # 8. Deploy Kubernetes manifests
      - name: Deploy to EKS
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      # 9. Update deployment with exact image version
      - name: Update image
        run: |
          kubectl set image deployment/$DEPLOYMENT_NAME \
            $CONTAINER_NAME=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} \
            -n $K8S_NAMESPACE

      # 10. Wait for rollout
      - name: Verify deployment
        run: |
          kubectl rollout status \
            deployment/$DEPLOYMENT_NAME \
            -n $K8S_NAMESPACE \
            --timeout=180s

      # 11. Show resources
      - name: Show deployment
        run: |
          kubectl get deployment -n $K8S_NAMESPACE
          kubectl get pods -n $K8S_NAMESPACE
          kubectl get service -n $K8S_NAMESPACE
